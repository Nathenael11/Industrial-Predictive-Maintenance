name: CI/CD Predictive Maintenance Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate Model Artifacts
        run: |
          python train_model.py

      - name: Run Pytest Suite
        run: |
          pytest tests/test_app.py

  build-and-deploy:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t elevvo-predictive-maintenance:${{ github.sha }} .
          docker tag elevvo-predictive-maintenance:${{ github.sha }} elevvo-predictive-maintenance:latest

      # Optional EC2 Deployment Step (requires secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY)
      - name: Deploy to EC2 (Optional)
        if: ${{ secrets.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/predictive-maintenance || git clone https://github.com/${{ github.repository }}.git /opt/predictive-maintenance
            cd /opt/predictive-maintenance
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
