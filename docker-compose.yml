version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elevvo_predictive_maintenance
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./model_artifacts:/app/model_artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
