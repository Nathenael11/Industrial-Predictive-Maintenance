<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d7de" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M 50 8 C 72 8 88 18 88 38 C 88 65 50 92 50 92 C 50 92 12 65 12 38 C 12 18 28 8 50 8 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="5" filter="url(#glow)" />

  <!-- Inner Gear Symbol -->
  <g transform="translate(50, 48) scale(0.6)" fill="url(#gearGrad)">
    <path d="M -8 -30 L 8 -30 L 10 -22 L 18 -18 L 26 -22 L 34 -10 L 28 -4 L 30 5 L 38 10 L 32 24 L 23 21 L 16 26 L 16 35 L 0 38 L -6 30 L -15 27 L -22 34 L -32 24 L -26 16 L -30 6 L -38 2 L -34 -12 L -25 -12 L -18 -19 L -20 -28 Z" />
    <circle cx="0" cy="0" r="12" fill="#0a0f1d" />
  </g>

  <!-- Telemetry Pulse Line -->
  <path d="M 24 50 L 38 50 L 44 38 L 52 64 L 60 44 L 66 50 L 76 50" 
        fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
